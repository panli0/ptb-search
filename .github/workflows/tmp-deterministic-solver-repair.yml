name: tmp-deterministic-solver-repair

on:
  pull_request:
    branches: [main]

concurrency:
  group: tmp-deterministic-solver-repair-20260818
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  repaired:
    strategy:
      fail-fast: false
      matrix:
        method: [cpsat, cbc]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source upstreams
        run: |
          set -euo pipefail
          pip install 'pyyaml==6.0.3' 'numpy==2.3.2' 'scikit-learn==1.7.1' \
            'simpleai==0.8.3' 'ortools==9.14.6206' 'submodlib-py==0.0.3' 'mcts==1.0.4' 'mip==1.17.6'
      - name: Apply frozen v4 predictor patch and deterministic solver repair
        run: |
          set -euo pipefail
          patch -p0 < native_online_v4_kernel_fix.patch
          python apply_deterministic_solver_budget_fix.py
          grep -n 'max_deterministic_time = 0.12' native_online_baselines_v4.py
          grep -n 'model.optimize(max_nodes=1000)' native_online_baselines_v4.py
          grep -n "model.seed =" native_online_baselines_v4.py
          grep -n "uses_outcome_defined_target_universe_for_policy.*False" native_online_baselines_v4.py
          python -m py_compile native_online_baselines_v4.py
      - name: Fetch frozen official datasets
        run: |
          set -euo pipefail
          git clone https://github.com/rschwiebert/dart_data.git dart_data
          git -C dart_data checkout 38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1
          test "$(git -C dart_data rev-parse HEAD)" = '38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1'
          curl --fail --location --retry 3 \
            'https://pub-65041ca69d744da88ade13abd31ad834.r2.dev/refs/heads/main.json' \
            -o pi-base-main.json
          echo '3a59130cbcaa10fe84e6e2d00d597435e0a7da53d8d267b22621017901d69836  pi-base-main.json' | sha256sum -c -
          git -C dart_data rev-parse HEAD > DART_COMMIT.txt
          sha256sum pi-base-main.json > PIBASE_SHA256.txt
      - name: Run repaired method twice and require exact equality
        run: |
          set -euo pipefail
          method='${{ matrix.method }}'
          python native_online_baselines_v4.py dart_data pi-base-main.json result-${method}-a.json "$method" > stdout-${method}-a.txt
          python native_online_baselines_v4.py dart_data pi-base-main.json result-${method}-b.json "$method" > stdout-${method}-b.txt
          cmp result-${method}-a.json result-${method}-b.json
          python - <<'PY'
          import json, os
          m=os.environ['METHOD']
          d=json.load(open(f'result-{m}-a.json'))
          for dom in d['domains']:
              assert dom['uses_unqueried_truth'] is False
              assert dom['uses_outcome_defined_target_universe_for_policy'] is False
              for s in dom['seeds']:
                  assert s['first_prediction_diagnostic']['variable_target_fraction'] >= 0.05
          print('REPAIRED_DETERMINISM_AND_LEAKAGE_GATES_PASS', m)
          PY
        env:
          METHOD: ${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-deterministic-${{ matrix.method }}
          path: |
            result-*.json
            stdout-*.txt
            native_online_baselines_v4.py
            native_online_v4_kernel_fix.patch
            apply_deterministic_solver_budget_fix.py
            DART_COMMIT.txt
            PIBASE_SHA256.txt
