name: tmp-final-deterministic-redo

on:
  pull_request:
    branches: [main]

concurrency:
  group: tmp-final-deterministic-redo-20260818
  cancel-in-progress: true

env:
  PYTHONHASHSEED: '0'

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        method: [psc, wpsc, bestfirst, astar, cpsat, cbc, mcts]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source upstreams
        run: |
          set -euo pipefail
          pip install 'pyyaml==6.0.3' 'numpy==2.3.2' 'scikit-learn==1.7.1' \
            'simpleai==0.8.3' 'ortools==9.14.6206' 'submodlib-py==0.0.3' 'mcts==1.0.4'
      - name: Apply frozen v4 predictor patch and audit contract
        run: |
          set -euo pipefail
          patch -p0 < native_online_v4_kernel_fix.patch
          grep -n "policy_targets = set(T)" native_online_baselines_v4.py
          grep -n "policy_targets = {rid for rid" native_online_baselines_v4.py
          grep -n "uses_outcome_defined_target_universe_for_policy.*False" native_online_baselines_v4.py
          grep -n "PREDICTOR_DEGENERATE" native_online_baselines_v4.py
          python -m py_compile native_online_baselines_v4.py
      - name: Fetch frozen official datasets
        run: |
          set -euo pipefail
          git clone https://github.com/rschwiebert/dart_data.git dart_data
          git -C dart_data checkout 38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1
          test "$(git -C dart_data rev-parse HEAD)" = '38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1'
          curl --fail --location --retry 3 \
            'https://pub-65041ca69d744da88ade13abd31ad834.r2.dev/refs/heads/main.json' \
            -o pi-base-main.json
          echo '3a59130cbcaa10fe84e6e2d00d597435e0a7da53d8d267b22621017901d69836  pi-base-main.json' | sha256sum -c -
          git -C dart_data rev-parse HEAD > DART_COMMIT.txt
          sha256sum pi-base-main.json > PIBASE_SHA256.txt
      - name: Run twice and require exact deterministic equality
        run: |
          set -euo pipefail
          method='${{ matrix.method }}'
          python native_online_baselines_v4.py dart_data pi-base-main.json "result-${method}-a.json" "$method" > "stdout-${method}-a.txt"
          python native_online_baselines_v4.py dart_data pi-base-main.json "result-${method}-b.json" "$method" > "stdout-${method}-b.txt"
          cmp "result-${method}-a.json" "result-${method}-b.json"
          python - <<'PY'
          import json, os
          m=os.environ['METHOD']
          d=json.load(open(f'result-{m}-a.json'))
          for dom in d['domains']:
              assert dom['uses_unqueried_truth'] is False
              assert dom['uses_outcome_defined_target_universe_for_policy'] is False
              for s in dom['seeds']:
                  assert s['first_prediction_diagnostic']['variable_target_fraction'] >= 0.05
          print('DETERMINISM_AND_LEAKAGE_GATES_PASS', m)
          PY
        env:
          METHOD: ${{ matrix.method }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-deterministic-native-${{ matrix.method }}
          path: |
            result-*.json
            stdout-*.txt
            native_online_baselines_v4.py
            native_online_v4_kernel_fix.patch
            DART_COMMIT.txt
            PIBASE_SHA256.txt

  legacy-audit:
    strategy:
      fail-fast: false
      matrix:
        mode: [scalar, target, tpe]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          pip install 'pyyaml==6.0.3' 'numpy==2.3.2' 'scikit-learn==1.7.1' 'optuna==4.5.0'
      - name: Audit source contract
        run: |
          set -euo pipefail
          grep -n "policy_targets = set(T)" outcome_universe_audit_redo.py
          grep -n "policy_targets = {rid for rid" outcome_universe_audit_redo.py
          grep -n "uses_outcome_defined_target_universe_for_policy.*False" outcome_universe_audit_redo.py
          python -m py_compile outcome_universe_audit_redo.py tpe_exact_outcome_safe_redo.py
      - name: Fetch frozen official datasets
        run: |
          set -euo pipefail
          git clone https://github.com/rschwiebert/dart_data.git dart_data
          git -C dart_data checkout 38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1
          test "$(git -C dart_data rev-parse HEAD)" = '38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1'
          mkdir -p MASPOB
          curl --fail --location --retry 3 \
            'https://pub-65041ca69d744da88ade13abd31ad834.r2.dev/refs/heads/main.json' \
            -o pi-base-main.json
          echo '3a59130cbcaa10fe84e6e2d00d597435e0a7da53d8d267b22621017901d69836  pi-base-main.json' | sha256sum -c -
      - name: Run twice and require exact deterministic equality
        run: |
          set -euo pipefail
          mode='${{ matrix.mode }}'
          if [ "$mode" = tpe ]; then
            python tpe_exact_outcome_safe_redo.py pi-base-main.json result-${mode}-a.json > stdout-${mode}-a.txt
            python tpe_exact_outcome_safe_redo.py pi-base-main.json result-${mode}-b.json > stdout-${mode}-b.txt
          else
            python outcome_universe_audit_redo.py dart_data pi-base-main.json MASPOB result-${mode}-a.json "$mode" all > stdout-${mode}-a.txt
            python outcome_universe_audit_redo.py dart_data pi-base-main.json MASPOB result-${mode}-b.json "$mode" all > stdout-${mode}-b.txt
          fi
          cmp result-${mode}-a.json result-${mode}-b.json
          echo "DETERMINISM_GATE_PASS $mode"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-deterministic-legacy-${{ matrix.mode }}
          path: |
            result-*.json
            stdout-*.txt
            outcome_universe_audit_redo.py
            tpe_exact_outcome_safe_redo.py

  maspob:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source upstreams
        run: |
          set -euo pipefail
          pip install 'pyyaml==6.0.3' 'numpy==2.3.2' 'scikit-learn==1.7.1' 'torch==2.8.0' 'torch-geometric==2.6.1'
      - name: Restore exact strict MASPOB adapter from its frozen commit
        run: |
          set -euo pipefail
          git fetch origin 0601e17eb8b4d95cabcf536e2c7057125756e086 --depth=1
          git show 0601e17eb8b4d95cabcf536e2c7057125756e086:maspob_gnn_ucb_v4.py > maspob_gnn_ucb_v4.py
          grep -n 'policy_U=set(T)' maspob_gnn_ucb_v4.py
          grep -n 'uses_outcome_defined_target_universe_for_policy.*False' maspob_gnn_ucb_v4.py
          python -m py_compile maspob_gnn_ucb_v4.py
      - name: Fetch frozen datasets and official MASPOB
        run: |
          set -euo pipefail
          git clone https://github.com/rschwiebert/dart_data.git dart_data
          git -C dart_data checkout 38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1
          test "$(git -C dart_data rev-parse HEAD)" = '38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1'
          curl --fail --location --retry 3 'https://pub-65041ca69d744da88ade13abd31ad834.r2.dev/refs/heads/main.json' -o pi-base-main.json
          echo '3a59130cbcaa10fe84e6e2d00d597435e0a7da53d8d267b22621017901d69836  pi-base-main.json' | sha256sum -c -
          git clone https://github.com/HZ1008/MASPOB.git MASPOB
          git -C MASPOB checkout 0be3af42da83b9b5ab187c101ec6d2ce87a5fe04
          test "$(git -C MASPOB rev-parse HEAD)" = '0be3af42da83b9b5ab187c101ec6d2ce87a5fe04'
          git -C MASPOB rev-parse HEAD > MASPOB_COMMIT.txt
      - name: Run twice and require exact deterministic equality
        run: |
          set -euo pipefail
          python maspob_gnn_ucb_v4.py dart_data pi-base-main.json MASPOB maspob-a.json > maspob-a.txt
          python maspob_gnn_ucb_v4.py dart_data pi-base-main.json MASPOB maspob-b.json > maspob-b.txt
          cmp maspob-a.json maspob-b.json
          echo MASPOB_DETERMINISM_GATE_PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-deterministic-maspob
          path: |
            maspob-*.json
            maspob-*.txt
            maspob_gnn_ucb_v4.py
            MASPOB_COMMIT.txt
