name: crystal-bcs-query
on:
  push:
    branches: [dart-public-data-run]
    paths: [RUN_CRYSTAL_QUERY]
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dart-public-data-run
      - name: Query official Bilbao MAXSUB sample
        run: |
          set -euxo pipefail
          mkdir -p crystal_public/query
          curl -L --fail --retry 3 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'gnum=221&submit=Show+maximal+subgroups' \
            https://cryst.ehu.es/cgi-bin/cryst/programs/nph-lxi \
            -o crystal_public/query/maxsub_221.html
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('crystal_public/query/maxsub_221.html').read_text(errors='replace')
          text=re.sub(r'<script.*?</script>|<style.*?</style>',' ',s,flags=re.I|re.S)
          text=re.sub(r'<[^>]+>',' ',text)
          text=re.sub(r'&nbsp;',' ',text)
          text=re.sub(r'&[a-zA-Z]+;',' ',text)
          text=re.sub(r'\s+',' ',text)
          out={'bytes':len(s),'title':(re.search(r'<title>(.*?)</title>',s,re.I|re.S).group(1).strip() if re.search(r'<title>(.*?)</title>',s,re.I|re.S) else None),'text':text[:30000]}
          Path('crystal_public/query/MAXSUB_221_EXTRACT.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2)[:30000])
          PY
      - name: Commit sample result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crystal_public/query
          git commit -m 'Query official Bilbao MAXSUB for space group 221' || true
          git push origin HEAD:dart-public-data-run
