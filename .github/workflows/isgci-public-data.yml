name: isgci-public-data

on:
  push:
    branches: [dart-public-data-run]
    paths: [RUN_ISGCI_PUBLIC]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dart-public-data-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and compile official ISGCI transfer data
        run: |
          set -euxo pipefail
          rm -rf isgci_public/out isgci_public/unpacked isgci_public/data.zip
          mkdir -p isgci_public/out
          curl -L --fail --retry 3 https://www.graphclasses.org/data.zip -o isgci_public/data.zip
          sha256sum isgci_public/data.zip > isgci_public/DATA_SHA256.txt
          unzip -l isgci_public/data.zip > isgci_public/ZIP_LISTING.txt
          unzip -q isgci_public/data.zip -d isgci_public/unpacked
          cp isgci_public/unpacked/isgci.dtd isgci_public/isgci.dtd
          cp isgci_public/unpacked/smallgraphs.txt isgci_public/smallgraphs.txt
          python -m pip install --quiet networkx==3.3
          BUNDLE_SHA=$(cut -d' ' -f1 isgci_public/DATA_SHA256.txt)
          python isgci_public/prepare_isgci_forbidden.py \
            --xml isgci_public/unpacked/isgci_sage.xml \
            --smallgraphs isgci_public/unpacked/smallgraphs.txt \
            --out isgci_public/out \
            --bundle-sha "$BUNDLE_SHA"
          cat isgci_public/out/SUMMARY.json
      - name: Commit compact public input
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf isgci_public/unpacked isgci_public/data.zip
          git add isgci_public
          git commit -m 'Compile exact ISGCI forbidden-class transfer input' || true
          git push origin HEAD:dart-public-data-run
