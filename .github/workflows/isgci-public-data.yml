name: isgci-public-data

on:
  push:
    branches: [dart-public-data-run]
    paths: [RUN_ISGCI_PUBLIC]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dart-public-data-run
          fetch-depth: 0
      - name: Fetch official ISGCI bundle
        run: |
          set -euxo pipefail
          rm -rf isgci_public
          mkdir -p isgci_public
          curl -L --fail --retry 3 https://www.graphclasses.org/data.zip -o isgci_public/data.zip
          sha256sum isgci_public/data.zip > isgci_public/DATA_SHA256.txt
          unzip -l isgci_public/data.zip > isgci_public/ZIP_LISTING.txt
          unzip -q isgci_public/data.zip -d isgci_public/unpacked
          find isgci_public/unpacked -type f -maxdepth 4 -printf '%p %s bytes\n' | sort > isgci_public/FILES.txt
          cp isgci_public/unpacked/isgci.dtd isgci_public/isgci.dtd
          cp isgci_public/unpacked/smallgraphs.txt isgci_public/smallgraphs.txt
          python - <<'PY'
          import collections, json, xml.etree.ElementTree as ET
          p='isgci_public/unpacked/isgci_sage.xml'
          tags=collections.Counter(); attrs=collections.Counter(); samples={}
          for ev,e in ET.iterparse(p,events=('end',)):
              tag=e.tag.split('}')[-1]
              tags[tag]+=1
              for a in e.attrib: attrs[(tag,a)]+=1
              if tag not in samples and tag in {'GraphClass','graphclass','incl','inclusion','smallgraph','smallGraph','equivalent','note'}:
                  samples[tag]=ET.tostring(e,encoding='unicode')[:4000]
              e.clear()
          with open('isgci_public/XML_STRUCTURE.json','w') as f:
              json.dump({'tags':tags.most_common(),'attrs':[(list(k),v) for k,v in attrs.most_common()],'samples':samples},f,indent=2)
          PY
          grep -nE '<!ELEMENT (incl|inclusion|graphclass|GraphClass|smallgraph|smallGraph)|<!ATTLIST (incl|inclusion|graphclass|GraphClass|smallgraph|smallGraph)' isgci_public/isgci.dtd > isgci_public/DTD_RELEVANT.txt || true
          cat isgci_public/DATA_SHA256.txt
          cat isgci_public/ZIP_LISTING.txt
          head -100 isgci_public/DTD_RELEVANT.txt || true
      - name: Commit inspection manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf isgci_public/unpacked isgci_public/data.zip
          git add isgci_public
          git commit -m 'Inspect ISGCI XML structure and witness schema' || true
          git push origin HEAD:dart-public-data-run
