name: tmp-lpt-probe
on:
  push:
    branches: [tmp-lpt-public-data-20260817]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install requests gdown
      - run: python lpt_nat/probe_sources.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpt-probe
          path: lpt_probe.json
          retention-days: 7
