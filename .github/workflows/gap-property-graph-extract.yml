name: gap-property-graph-extract
on:
  push:
    branches: [dart-public-data-run]
    paths: [RUN_GAP_GRAPH]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dart-public-data-run
      - uses: actions/checkout@v4
        with:
          repository: gap-system/gap
          ref: 8636b5a96cff81c21e9d386872f9f2922a90887a
          path: _upstream/gap
      - name: Extract conservative finite-group property graph
        run: |
          set -euxo pipefail
          python gap_public/extract_finite_group_property_graph.py
          cat gap_public/FINITE_GROUP_PROPERTY_GRAPH.json
      - name: Commit graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+panli0@users.noreply.github.com
          git add gap_public/FINITE_GROUP_PROPERTY_GRAPH.json
          git commit -m 'Extract pinned GAP finite-group property graph' || true
          git push origin HEAD:dart-public-data-run
