name: gap-smallgroups-compile-v2
on:
  push:
    branches: [dart-public-data-run]
    paths: [RUN_GAP_SMALLGROUPS_V2]
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dart-public-data-run
      - name: Install aligned runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gap gap-smallgrp >/dev/null
          python -m pip install --quiet networkx==3.3
          gap -q -c 'Print(GAPInfo.Version,"\n");QUIT;' | tee /tmp/gapver
          grep -qx '4.12.1' /tmp/gapver
      - name: Evaluate exact SmallGroups truth table
        run: |
          set -euxo pipefail
          rm -rf gap_public/smallgroups_out
          python gap_public/prepare_smallgroups_truth.py
          gap -q /tmp/eval_smallgroups.g > gap_public/smallgroups_out/TRUTH.csv
          test $(wc -l < gap_public/smallgroups_out/TRUTH.csv) -gt 10
          head -5 gap_public/smallgroups_out/TRUTH.csv
      - name: Audit author implications and compile witnesses
        run: python gap_public/compile_smallgroups_witnesses.py
      - uses: actions/upload-artifact@v4
        with:
          name: gap-smallgroups-property-transfer-v2
          path: gap_public/smallgroups_out/
          if-no-files-found: error
      - name: Commit summary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+panli0@users.noreply.github.com
          git add gap_public/smallgroups_out/ABSTRACT_GRAPH.json gap_public/smallgroups_out/SUMMARY.json
          git commit -m 'Compile aligned GAP 4.12.1 SmallGroups transfer input' || true
          git push origin HEAD:dart-public-data-run
