name: tmp-native-online-v4

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tmp-native-online-v4-20260818
  cancel-in-progress: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        method: [psc, wpsc, bestfirst, astar, cpsat, cbc, mcts]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned open-source upstreams
        run: |
          pip install 'pyyaml==6.0.3' 'numpy==2.3.2' 'scikit-learn==1.7.1' \
            'simpleai==0.8.3' 'ortools==9.14.6206' 'submodlib-py==0.0.3' 'mcts==1.0.4'
      - name: Audit source contract
        run: |
          set -euo pipefail
          grep -n "policy_targets = set(T)" native_online_baselines_v4.py
          grep -n "policy_targets = {rid for rid" native_online_baselines_v4.py
          grep -n "uses_outcome_defined_target_universe_for_policy.*False" native_online_baselines_v4.py
          grep -n "class PairwiseSGDPredictor" native_online_baselines_v4.py
          python -m py_compile native_online_baselines_v4.py
      - name: Fetch frozen official datasets
        run: |
          set -euo pipefail
          git clone https://github.com/rschwiebert/dart_data.git dart_data
          git -C dart_data checkout 38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1
          test "$(git -C dart_data rev-parse HEAD)" = "38a000a67a1ca777ad35fdd7c6de8a4cc99adcb1"
          git -C dart_data rev-parse HEAD | tee DART_COMMIT.txt
          curl --fail --location --retry 3 \
            'https://pub-65041ca69d744da88ade13abd31ad834.r2.dev/refs/heads/main.json' \
            -o pi-base-main.json
          echo '3a59130cbcaa10fe84e6e2d00d597435e0a7da53d8d267b22621017901d69836  pi-base-main.json' | sha256sum -c -
          sha256sum pi-base-main.json | tee PIBASE_SHA256.txt
      - name: Run strict outcome-universe-safe online adapter
        run: |
          set -euo pipefail
          python native_online_baselines_v4.py dart_data pi-base-main.json \
            result-${{ matrix.method }}.json ${{ matrix.method }} | tee stdout-${{ matrix.method }}.txt
          test -s result-${{ matrix.method }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-online-v4-${{ matrix.method }}
          path: |
            result-${{ matrix.method }}.json
            stdout-${{ matrix.method }}.txt
            native_online_baselines_v4.py
            DART_COMMIT.txt
            PIBASE_SHA256.txt
