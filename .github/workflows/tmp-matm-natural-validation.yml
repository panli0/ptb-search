name: tmp-matm-natural-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [tmp-matm-natural-validation-20260817]

jobs:
  matm-natural-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow 'huggingface_hub[hf_xet]'

      - name: Download frozen MATM ALFWorld eval trajectories
        run: |
          mkdir -p tmp_matm_validation/data
          python - <<'PY'
          from pathlib import Path
          import gzip, shutil, zipfile
          from huggingface_hub import HfApi, hf_hub_download
          repo='toeunkim/matm-trajectories'
          files=HfApi().list_repo_files(repo_id=repo, repo_type='dataset')
          candidates=[f for f in files if f.startswith('alfworld/') and 'population_runs' in f.lower()]
          print('CANDIDATES', candidates)
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one ALFWorld population_runs source, got {candidates}')
          src=candidates[0]
          p=Path(hf_hub_download(repo_id=repo, repo_type='dataset', filename=src, local_dir='tmp_matm_validation/data'))
          print('DOWNLOADED', p, p.stat().st_size)
          out=p
          low=p.name.lower()
          if low.endswith('.gz'):
              out=p.with_suffix('')
              with gzip.open(p,'rb') as fi, open(out,'wb') as fo: shutil.copyfileobj(fi,fo)
          elif low.endswith('.zip'):
              with zipfile.ZipFile(p) as z:
                  names=[n for n in z.namelist() if not n.endswith('/')]
                  if len(names)!=1: raise SystemExit(f'Unexpected zip members: {names}')
                  z.extract(names[0], path=p.parent)
                  out=p.parent/names[0]
          Path('tmp_matm_validation/INPUT_PATH.txt').write_text(str(out)+'\n')
          PY
          INPUT=$(cat tmp_matm_validation/INPUT_PATH.txt)
          test -s "$INPUT"
          ls -lh "$INPUT"
          sha256sum "$INPUT" | tee tmp_matm_validation/DATA_SHA256.txt

      - name: Export raw preregistered A/B audit subset
        run: |
          INPUT=$(cat tmp_matm_validation/INPUT_PATH.txt)
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path('tmp_matm_validation/data/alfworld/population_runs.parquet')
          d=pd.read_parquet(p)
          z=d[(d['environment'].astype(str).str.lower()=='alfworld') & (d['source_type'].astype(str).str.lower()=='eval') & (d['retrieval_strategy'].astype(str).str.lower().str.strip()=='no_retrieval') & (d['task_type'].isin(['pick_two_obj_and_place','look_at_obj_in_light']))].copy()
          z.to_json('tmp_matm_validation/AB_no_retrieval.jsonl',orient='records',lines=True,force_ascii=False)
          print('AUDIT_SUBSET',len(z),z['task_type'].value_counts().to_dict(), 'success', z.groupby('task_type')['success'].agg(['sum','count']).to_dict('index'))
          PY

      - name: Run frozen natural validation
        run: |
          INPUT=$(cat tmp_matm_validation/INPUT_PATH.txt)
          python tmp_matm_validation/analyze_matm_natural_run.py \
            "$INPUT" \
            --out tmp_matm_validation/out \
            --bootstrap 100000 \
            --seed 20260817 \
            --retrieval no_retrieval

      - name: Print result
        if: always()
        run: |
          echo '=== SUMMARY ==='
          test -f tmp_matm_validation/out/SUMMARY.json && cat tmp_matm_validation/out/SUMMARY.json || true
          echo '=== REPORT ==='
          test -f tmp_matm_validation/out/REPORT.md && cat tmp_matm_validation/out/REPORT.md || true

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matm-natural-validation-results
          path: |
            tmp_matm_validation/out/
            tmp_matm_validation/DATA_SHA256.txt
            tmp_matm_validation/INPUT_PATH.txt
            tmp_matm_validation/data/alfworld/population_runs.parquet
            tmp_matm_validation/AB_no_retrieval.jsonl
          if-no-files-found: warn
