name: tmp-matm-natural-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [tmp-matm-natural-validation-20260817]

jobs:
  matm-export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas pyarrow 'huggingface_hub[hf_xet]'
      - name: Download and export A/B cohorts
        run: |
          mkdir -p tmp_matm_validation/data
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from huggingface_hub import HfApi, hf_hub_download
          repo='toeunkim/matm-trajectories'
          files=HfApi().list_repo_files(repo_id=repo, repo_type='dataset')
          src=[f for f in files if f.startswith('alfworld/') and 'population_runs' in f.lower()][0]
          p=Path(hf_hub_download(repo_id=repo, repo_type='dataset', filename=src, local_dir='tmp_matm_validation/data'))
          d=pd.read_parquet(p)
          ab=d[(d['environment'].astype(str).str.lower()=='alfworld') & (d['source_type'].astype(str).str.lower()=='eval') & d['task_type'].isin(['pick_two_obj_and_place','look_at_obj_in_light'])].copy()
          ab.to_json('tmp_matm_validation/AB_all_eval.jsonl',orient='records',lines=True,force_ascii=False)
          nr=ab[ab['retrieval_strategy'].astype(str).str.lower().str.strip()=='no_retrieval'].copy()
          fresh=ab[ab['retrieval_strategy'].astype(str).str.lower().str.strip()!='no_retrieval'].copy()
          nr.to_json('tmp_matm_validation/AB_no_retrieval.jsonl',orient='records',lines=True,force_ascii=False)
          fresh.to_json('tmp_matm_validation/AB_retrieval_enabled_UNTOUCHED.jsonl',orient='records',lines=True,force_ascii=False)
          meta={
            'all_ab_rows':len(ab),'no_retrieval_rows':len(nr),'untouched_rows':len(fresh),
            'retrieval_strategy_counts':ab['retrieval_strategy'].astype(str).value_counts().to_dict(),
            'task_type_counts_all':ab['task_type'].value_counts().to_dict(),
            'task_type_counts_untouched':fresh['task_type'].value_counts().to_dict(),
            'models_untouched':int(fresh['model'].nunique()),
          }
          Path('tmp_matm_validation/COHORT_METADATA.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY
          sha256sum tmp_matm_validation/data/alfworld/population_runs.parquet > tmp_matm_validation/DATA_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: matm-ab-cohorts
          path: |
            tmp_matm_validation/AB_all_eval.jsonl
            tmp_matm_validation/AB_no_retrieval.jsonl
            tmp_matm_validation/AB_retrieval_enabled_UNTOUCHED.jsonl
            tmp_matm_validation/COHORT_METADATA.json
            tmp_matm_validation/DATA_SHA256.txt
