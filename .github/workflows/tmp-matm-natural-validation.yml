name: tmp-matm-natural-validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [tmp-matm-natural-validation-20260817]

jobs:
  matm-natural-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas 'huggingface_hub[hf_xet]'

      - name: Download frozen MATM ALFWorld eval trajectories
        run: |
          mkdir -p tmp_matm_validation/data
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p = hf_hub_download(
              repo_id='toeunkim/matm-trajectories',
              repo_type='dataset',
              filename='alfworld/population_runs.jsonl',
              local_dir='tmp_matm_validation/data',
          )
          print('DOWNLOADED', p)
          PY
          test -s tmp_matm_validation/data/alfworld/population_runs.jsonl
          ls -lh tmp_matm_validation/data/alfworld/population_runs.jsonl
          sha256sum tmp_matm_validation/data/alfworld/population_runs.jsonl | tee tmp_matm_validation/DATA_SHA256.txt

      - name: Run frozen natural validation
        run: |
          python tmp_matm_validation/analyze_matm_natural_run.py \
            tmp_matm_validation/data/alfworld/population_runs.jsonl \
            --out tmp_matm_validation/out \
            --bootstrap 100000 \
            --seed 20260817 \
            --retrieval no_retrieval

      - name: Print result
        if: always()
        run: |
          echo '=== SUMMARY ==='
          test -f tmp_matm_validation/out/SUMMARY.json && cat tmp_matm_validation/out/SUMMARY.json || true
          echo '=== REPORT ==='
          test -f tmp_matm_validation/out/REPORT.md && cat tmp_matm_validation/out/REPORT.md || true

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matm-natural-validation-results
          path: |
            tmp_matm_validation/out/
            tmp_matm_validation/DATA_SHA256.txt
          if-no-files-found: warn
